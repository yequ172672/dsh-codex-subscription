# dsh-llm-codex bundle patch —— 随包分发的 profile 层。
#
# 由 `dsh plugin --profile <name> add dsh-llm-codex` 自动挂载:
# reconcile 发现包声明了 dsh.bundle 后,会自动把本包加入
# profile package.json 的 dsh.profile.bundles 层栈,无需手工编辑
# cordis.patch.yml。
#
# 机器相关的配置(如 proxy)请放 profile entry 的 config(或 DSH 设置页),不进本文件。
- insert:
    - id: llm-codex
      name: 'dsh-llm-codex'
